name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Check Rust workspace
        run: cargo check --workspace --exclude decode-disk-doctor-app
      - name: Run core tests
        run: cargo test --workspace --exclude decode-disk-doctor-app
      - name: Run Clippy
        run: cargo clippy --workspace --exclude decode-disk-doctor-app --all-targets -- -D warnings

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
